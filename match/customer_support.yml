matches:
  - trigger: ":support:"
    replace: "{{output}}"
    vars:
      - name: "clip_content_agent"
        type: "clipboard"
      - name: faq_list_script_output
        type: script
        params:
          args:
            - "%CONFIG%/.venv/Scripts/python.exe"
            - "%CONFIG%/scripts/list_faq_files.py"
      # Dynamic defaults based on saved preferences
      - name: "default_sentiment"
        type: "script"
        params:
          args:
            - "%CONFIG%/.venv/Scripts/python.exe"
            - "%CONFIG%/scripts/get_form_defaults.py"
            - "customer_support"
            - "sentiment"
      - name: "default_relation"
        type: "script"
        params:
          args:
            - "%CONFIG%/.venv/Scripts/python.exe"
            - "%CONFIG%/scripts/get_form_defaults.py"
            - "customer_support"
            - "relation"
      - name: "default_selected_faq"
        type: "script"
        params:
          args:
            - "%CONFIG%/.venv/Scripts/python.exe"
            - "%CONFIG%/scripts/get_form_defaults.py"
            - "customer_support"
            - "selected_faq"
      - name: "default_language_choice"
        type: "script"
        params:
          args:
            - "%CONFIG%/.venv/Scripts/python.exe"
            - "%CONFIG%/scripts/get_form_defaults.py"
            - "customer_support"
            - "language_choice"
      - name: "default_include_screenshot"
        type: "script"
        params:
          args:
            - "%CONFIG%/.venv/Scripts/python.exe"
            - "%CONFIG%/scripts/get_form_defaults.py"
            - "customer_support"
            - "include_screenshot"

      - name: form
        type: form
        params:
          layout: |
            Style de réponse 
            [[sentiment]]
            --------------------------------------------------------------------------------------------------------
            Type de relation  
            [[relation]]
            --------------------------------------------------------------------------------------------------------
            FAQ à inclure
            [[selected_faq]]
            --------------------------------------------------------------------------------------------------------
            LANGUE DE SORTIE:
            [[language_choice]]
            --------------------------------------------------------------------------------------------------------
            Inclure une capture d'écran?
            [[include_screenshot]]
            --------------------------------------------------------------------------------------------------------
            MESSAGE ACTUEL (du presse-papiers):
            [[message]]
            --------------------------------------------------------------------------------------------------------
            ESQUISSE DE RÉPONSE SOUHAITÉE (optionnel):
            [[desired_answer_sketch]]
          fields:
            message:
              type: text
              multiline: true
              default: "{{clip_content_agent}}"
            sentiment:
              type: list
              default: "{{default_sentiment}}"
              values:
                - affirmatif
                - neutre
                - negatif
            relation:
              type: list
              default: "{{default_relation}}"
              values:
                - client
                - collègue
                - ami
            selected_faq:
              type: list
              default: "{{default_selected_faq}}"
              values: "{{faq_list_script_output}}"
            language_choice:
              type: list
              default: "{{default_language_choice}}"
              values:
                - English
                - French
            include_screenshot:
              type: list
              values: 
                - "true"
                - "false"
              default: "{{default_include_screenshot}}"
              label: "Inclure une capture d'écran?"
            desired_answer_sketch:
              type: text
              multiline: true
              label: "Esquisse de réponse souhaitée (optionnel)"

      - name: output
        type: script
        params:
          args:
            - "%CONFIG%/.venv/Scripts/python.exe"
            - "%CONFIG%/scripts/customer_support.py"
            - "{{form.sentiment}}"
            - "{{form.relation}}"
            - "{{form.selected_faq}}"
            - "{{form.language_choice}}"
            - "{{form.include_screenshot}}"
            - "{{form.message}}"
            - "{{form.desired_answer_sketch}}"